<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marco Carnevali &mdash; Principal Software Engineer</title>
  <style>
    :root { --bg:#f8f8f8; --fg:#000; --muted:#555; --line:#111; --accent:#2ea043; }
    html,body{height:100%}
    body{
      margin:0; padding:48px; background:var(--bg); color:var(--fg);
      font:20px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      display:flex; flex-direction:column; justify-content:center;
      min-height:100vh;
      min-height:100svh;
      gap:32px;
    }
    #content{max-width:820px; text-align:left;}
    .line{display:block; white-space:pre-wrap;}
    .line .text{white-space:pre-wrap}

    /* Smooth caret */
    .caret{display:inline-block; margin-left:2px; animation:blinkSmooth 1.2s ease-in-out infinite; color:var(--accent)}
    .caret::after{content:"▍"}
    @keyframes blinkSmooth{0%,100%{opacity:1} 50%{opacity:0}}

    /* Footer grid */
    footer{margin-top:24px}
    .grid{display:grid; grid-template-columns:repeat(2,minmax(70px,1fr)); gap:16px; max-width:200px; justify-items:start}
    .tile{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-decoration:none; color:inherit; font-size:14px; opacity:0; transform:scale(.9) translateY(8px);}
    .icon{height:60px; width:60px; border:1.5px solid var(--line); border-radius:16px; display:grid; place-items:center; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease}
    .icon svg{height:26px; width:26px}
    .icon span{font-size:20px}
    .tile:hover .icon{transform:translateY(-3px) scale(1.1); box-shadow:0 6px 18px rgba(0,0,0,0.15); border-color:var(--accent)}
    .tile:hover{color:var(--fg)}

    #skipBtn{
      position:fixed; bottom:24px; right:24px;
      padding:6px 12px; background:transparent; color:var(--muted);
      border:1px solid var(--muted); border-radius:6px; font-size:11px; cursor:pointer;
      opacity:0; pointer-events:none; transition:opacity .3s, color .2s, border-color .2s;
      font-family:inherit;
    }
    #skipBtn.visible{opacity:0.6; pointer-events:auto}
    #skipBtn:hover{opacity:1; color:var(--accent); border-color:var(--accent)}

    /* Appear animation for tiles */
    @keyframes springPop {0%{opacity:0; transform:scale(.9) translateY(8px)} 60%{opacity:1; transform:scale(1.05) translateY(-2px)} 100%{opacity:1; transform:scale(1) translateY(0)}}
    .show .tile{ animation: springPop .5s cubic-bezier(.22,1,.36,1) forwards }
    .show .tile:nth-child(1){ animation-delay:.45s }
    .show .tile:nth-child(2){ animation-delay:.6s }

    .copyright{font-size:12px; color:var(--muted); margin-top:32px; padding-top:16px;}

    @media (max-width:560px){
      body{padding:28px; gap:24px; font-size:18px}
      .grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <main id="content" aria-live="polite" aria-atomic="true"></main>
  <button id="skipBtn" type="button" aria-label="Skip animation">Skip animation [Enter]</button>

  <!-- Footer links -->
  <footer id="footerLinks">
    <div class="grid">
      <a class="tile" href="https://www.linkedin.com/in/marcocarnevali/">
        <div class="icon"><span>in</span></div>
        <div>LinkedIn</div>
      </a>
      <a class="tile" href="mailto:marcocarnevali@me.com">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16v16H4z"/>
            <path d="M4 6l8 6 8-6"/>
          </svg>
        </div>
        <div>Email</div>
      </a>
    </div>
    <div class="copyright">&copy; <span id="year"></span> Marco Carnevali. All rights reserved.</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function(){
      const LINES = [
        "Hello. I’m Marco.",
        "I’m a Principal Software Engineer building reliable and scalable software systems for mobile.",
        "I’m architecting. Coding. Testing. Shipping.",
        "Building with AI. Obsessed with clarity, craft, and systems that recover predictably.",
      ];
      const SPEED = 20;
      const PAUSE_BETWEEN = 400;
      const INITIAL_CURSOR_DELAY = 800;
      const FOOTER_DELAY_AFTER_TEXT = 800;

      const container = document.getElementById('content');
      const footer = document.getElementById('footerLinks');
      const skipBtn = document.getElementById('skipBtn');
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let isSkipped = false;

      function skip(){
        if (isSkipped) return;
        isSkipped = true;
        skipBtn.classList.remove('visible');
      }

      skipBtn.addEventListener('click', skip);
      window.addEventListener('keydown', (e) => { if(e.key === 'Enter') skip(); });

      function createLine(){
        const line = document.createElement('div');
        line.className = 'line';
        const textSpan = document.createElement('span');
        textSpan.className = 'text';
        const caret = document.createElement('span');
        caret.className = 'caret';
        line.appendChild(textSpan);
        line.appendChild(caret);
        return { line, textSpan, caret };
      }

      function removeCaret(lineEl){
        const c = lineEl.querySelector('.caret');
        if (c) c.remove();
      }

      function type(text, textSpan){
        return new Promise(resolve => {
          let i = 0;
          const tick = () => {
            if (isSkipped) {
              textSpan.textContent = text;
              resolve();
              return;
            }
            if (i < text.length){
              textSpan.textContent += text.charAt(i++);
              setTimeout(tick, SPEED);
            } else { resolve(); }
          };
          tick();
        });
      }

      async function run(){
        if (reduce) {
          showInstantly();
          return;
        }

        skipBtn.classList.add('visible');

        let { line, textSpan } = createLine();
        container.appendChild(line);

        await new Promise(r => setTimeout(r, INITIAL_CURSOR_DELAY));

        for (let i=0;i<LINES.length;i++){
          if (isSkipped) break;
          await type(LINES[i], textSpan);
          removeCaret(line);
          if (i < LINES.length - 1){
            container.appendChild(document.createElement('br'));
            ({ line, textSpan } = createLine());
            container.appendChild(line);
          }
        }

        if (isSkipped) {
          showInstantly();
        } else {
          const eofCaret = document.createElement('span');
          eofCaret.className = 'caret';
          line.appendChild(eofCaret);
          skipBtn.classList.remove('visible');
          await new Promise(r => setTimeout(r, FOOTER_DELAY_AFTER_TEXT));
          footer.classList.add('show');
        }
      }

      function showInstantly(){
        container.innerHTML = '';
        for (let i=0;i<LINES.length;i++){
          const { line, textSpan } = createLine();
          textSpan.textContent = LINES[i];
          removeCaret(line);
          container.appendChild(line);
          if (i < LINES.length - 1){
            container.appendChild(document.createElement('br'));
          } else {
            line.appendChild(document.createElement('span')).className = 'caret';
          }
        }
        footer.classList.add('show');
        skipBtn.classList.remove('visible');
      }

      run();
    })();
  </script>
</body>
</html>
